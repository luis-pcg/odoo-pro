services:
  odoo:
    container_name: "${ODOO_DEVELOPER}_v17"
    user: root
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ODOO_PORT}:8069"        # Puerto de Odoo
      - "${ODOO_DEBUG_PORT}:3001" # Puerto del Debugger
    environment:
      - DB_PORT_5432_TCP_ADDR=${DB_PORT_5432_TCP_ADDR}
      - DB_PORT_5432_TCP_PORT=${DB_PORT_5432_TCP_PORT}
      - DB_ENV_POSTGRES_USER=${DB_ENV_POSTGRES_USER}
      - DB_ENV_POSTGRES_PASSWORD=${DB_ENV_POSTGRES_PASSWORD}
      - ODOO_DEBUG_PORT=${ODOO_DEBUG_PORT}
      - ODOO_AUTO_UPDATE_MODULES=${ODOO_AUTO_UPDATE_MODULES}
      - ODOO_DATABASE_NAME=${ODOO_DATABASE_NAME}
    volumes:
      - ./addons/:/mnt/extra-addons:delegated
      - ./enterprise/:/mnt/extra-addons-enterprise:delegated
      - ./conf:/etc/odoo:delegated
      - odoo_pro_ODOO_DATA:/var/lib/odoo:cached

volumes:
  odoo_pro_ODOO_DATA: