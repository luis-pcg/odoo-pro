<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>

  <!-- ───────────────────────── MAESTRA ───────────────────────── -->
  <rect x="290" y="24" width="700" height="392" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="314" y="58" font-size="20" font-weight="700" fill="#0f172a">PADRE — PROGRESSA (Casa Matriz)</text>
  <text x="314" y="80" font-size="14" fill="#64748b">única instancia con el módulo instalado · fuente de verdad de los parámetros</text>

  <rect x="314" y="98" width="652" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="334" y="127" font-size="14" fill="#0f172a"><tspan font-weight="600">1 ·</tspan> Nómina publica una escala nueva y alguien la edita aquí, una sola vez</text>

  <line x1="640" y1="144" x2="640" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="314" y="166" width="652" height="58" rx="8" fill="#fefce8" stroke="#eab308"/>
  <text x="334" y="191" font-size="14" fill="#0f172a"><tspan font-weight="600">2 ·</tspan> Tarea nocturna 02:30 RD — <tspan font-family="ui-monospace, Menlo, monospace">l10n.do.payroll.sync.run</tspan></text>
  <text x="334" y="211" font-size="13" fill="#64748b">un solo horario para toda la flota · un hilo por servidor cliente</text>

  <line x1="640" y1="224" x2="640" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="314" y="246" width="652" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="334" y="271" font-size="14" fill="#0f172a"><tspan font-weight="600">3 ·</tspan> Se arma el envío UNA vez: <tspan font-family="ui-monospace, Menlo, monospace">Modelos sincronizados</tspan> decide qué viaja</text>
  <text x="334" y="291" font-size="13" fill="#64748b">escalas ISR · riesgo laboral · topes y tasas TSS y sus vigencias</text>

  <line x1="640" y1="304" x2="640" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="314" y="326" width="652" height="66" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="334" y="351" font-size="14" fill="#0f172a"><tspan font-weight="600">4 ·</tspan> Por cada hija: leer lo que ya tiene → comparar → escribir solo lo distinto</text>
  <text x="334" y="371" font-size="13" fill="#64748b">credenciales tomadas de <tspan font-family="ui-monospace, Menlo, monospace">Bases de datos</tspan> · noche sin cambios = 5 llamadas por hija</text>

  <!-- flechas hacia las hijas -->
  <path d="M 500 392 L 500 470 L 260 470 L 260 530" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M 780 392 L 780 470 L 1020 470 L 1020 530" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="470" y="440" width="340" height="34" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="640" y="463" font-size="13.5" fill="#0f766e" text-anchor="middle" font-weight="600">JSON-2 (/json/2) · si el cliente es viejo, XML-RPC</text>

  <!-- ───────────────────────── HIJAS ───────────────────────── -->
  <rect x="60" y="532" width="400" height="252" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="566" font-size="18" font-weight="700" fill="#0f172a">HIJA 1 — Distribuidora Acme</text>
  <text x="84" y="588" font-size="13.5" fill="#64748b">no instala nada del módulo</text>
  <rect x="84" y="604" width="352" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="629" font-size="13.5" fill="#0f172a">Solo <tspan font-family="ui-monospace, Menlo, monospace">l10n_do_hr_payroll</tspan> y una llave de API</text>
  <rect x="84" y="652" width="352" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="677" font-size="13.5" fill="#0f172a">Se escriben sus modelos estándar de nómina</text>
  <rect x="84" y="700" width="352" height="62" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="100" y="723" font-size="13.5" fill="#0f172a">Lo que se edite a mano aquí se pierde</text>
  <text x="100" y="743" font-size="12.5" fill="#991b1b">la maestra sobrescribe en la próxima ventana</text>

  <rect x="820" y="532" width="400" height="252" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="844" y="566" font-size="18" font-weight="700" fill="#0f172a">HIJA 2 — Ferretería Bella Vista</text>
  <text x="844" y="588" font-size="13.5" fill="#64748b">no instala nada del módulo</text>
  <rect x="844" y="604" width="352" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="860" y="629" font-size="13.5" fill="#0f172a">Cada hija falla o triunfa por su cuenta</text>
  <rect x="844" y="652" width="352" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="860" y="677" font-size="13.5" fill="#0f172a">Si está caída, la otra recibe igual</text>
  <rect x="844" y="700" width="352" height="62" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="860" y="723" font-size="13.5" fill="#0f172a">Lo que solo existe aquí no se toca</text>
  <text x="860" y="743" font-size="12.5" fill="#1e40af">nunca se borra nada en una hija</text>

  <!-- bitácora -->
  <rect x="480" y="562" width="320" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="640" y="592" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Bitácora en el padre</text>
  <text x="640" y="616" font-size="13" fill="#64748b" text-anchor="middle">una corrida por noche</text>
  <text x="640" y="636" font-size="13" fill="#64748b" text-anchor="middle">un registro por hija</text>
  <text x="640" y="656" font-size="13" fill="#64748b" text-anchor="middle">una línea por parámetro tocado</text>
  <text x="640" y="674" font-size="12.5" fill="#94a3b8" text-anchor="middle">las hijas no guardan nada del proceso</text>
</svg>
